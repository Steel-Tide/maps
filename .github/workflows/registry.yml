name: Registry

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # nightly: the download counts into the index
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs

  index:
    # the release and the index are rebuilt from what is on main, and the index committed back
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sync the release the maps are counted on
        run: node tools/sync-release.mjs --out .counts.json
      - run: node tools/build-index.mjs --counts .counts.json
      - name: put the index on the release too
        run: gh release upload registry index.json --clobber
      - name: commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuild [skip ci]"
          git push
